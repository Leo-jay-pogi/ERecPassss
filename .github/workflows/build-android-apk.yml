name: Build ERecPass Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "*.js"
      - "admin-login-apk-fix.js"
      - "*.css"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.svg"
      - "*.webp"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"
      - ".github/workflows/build-android-release.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ERecPass
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare web assets and Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          rsync -av ./ www/ --exclude '.git/' --exclude '.github/' --exclude 'www/' --exclude 'android/' --exclude 'node_modules/' --exclude 'package-lock.json' --exclude 'package.json'
          npm init -y
          npm install @capacitor/core@^6 @capacitor/android@^6 @supabase/supabase-js@^2 qrcodejs html5-qrcode
          npm install --save-dev @capacitor/cli@^6 esbuild
          # Bundle Supabase locally for Android WebView so Admin login does not
          # depend on loading the Supabase SDK from a third-party CDN at runtime.
          mkdir -p www/vendor
          npx esbuild @supabase/supabase-js --bundle --format=iife --global-name=supabase --outfile=www/vendor/supabase.js
          # Package QR generation and camera-scanner libraries locally so the APK
          # does not rely on public CDNs for these core patient/staff functions.
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          vendor = Path("www/vendor")
          vendor.mkdir(parents=True, exist_ok=True)
          packages = [
              (Path("node_modules/qrcodejs"), "qrcode.min.js", vendor / "qrcode.min.js"),
              (Path("node_modules/html5-qrcode"), "html5-qrcode.min.js", vendor / "html5-qrcode.min.js"),
          ]
          for root, filename, destination in packages:
              matches = list(root.rglob(filename)) if root.exists() else []
              if not matches:
                  raise SystemExit(f"Missing {filename} in installed package {root}")
              # Prefer a root-level distribution if the package contains duplicates.
              matches.sort(key=lambda p: (len(p.parts), str(p)))
              shutil.copy2(matches[0], destination)
              if not destination.is_file() or destination.stat().st_size < 1000:
                  raise SystemExit(f"Bundled library is missing or unexpectedly small: {destination}")
              print(f"Bundled {matches[0]} -> {destination}")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("www/index.html")
          s = p.read_text()
          replacements = [
              (r'<script\s+src=["\']https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2["\']\s*></script>', '<script src="./vendor/supabase.js"></script>', "Supabase SDK"),
              (r'<script\s+src=["\']https://cdnjs\.cloudflare\.com/ajax/libs/qrcodejs/1\.0\.0/qrcode\.min\.js["\']\s*></script>', '<script src="./vendor/qrcode.min.js"></script>', "QR generator"),
              (r'<script\s+src=["\']https://unpkg\.com/html5-qrcode["\']\s*></script>', '<script src="./vendor/html5-qrcode.min.js"></script>', "QR scanner"),
          ]
          for pattern, replacement, label in replacements:
              s, count = re.subn(pattern, lambda _m: replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f"Could not replace expected {label} CDN script tag in packaged index.html")
          p.write_text(s)
          PY
          # Ensure Android declares camera access for the in-app QR scanner.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in s:
              match = re.search(r'<manifest\b[^>]*>', s)
              if not match:
                  raise SystemExit("Could not locate manifest root to add camera permission")
              s = s[:match.end()] + "\n    " + permission + s[match.end():]
              p.write_text(s)
          PY
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.erecpass.hospital",
            "appName": "ERecPass",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          # Add a small native bridge so the installed APK can save patient QR PNGs
          # directly to the public Downloads folder on Android 10+.
          mkdir -p android/app/src/main/java/com/erecpass/hospital
          cat > android/app/src/main/java/com/erecpass/hospital/MainActivity.java <<'JAVA'
          package com.erecpass.hospital;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import java.io.OutputStream;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (bridge != null && bridge.getWebView() != null) {
                bridge.getWebView().addJavascriptInterface(new PatientQrDownloader(), "ERecPassNative");
                // WebView exposes newly added JavascriptInterface objects on the next page load.
                // Reload only on a fresh Activity launch so the QR download bridge is available
                // before the user taps Download / Save QR.
                if (savedInstanceState == null) {
                  bridge.getWebView().post(() -> bridge.getWebView().reload());
                }
              }
            }

            private class PatientQrDownloader {
              @JavascriptInterface
              public String savePng(String base64Png, String requestedName) {
                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                  return "ERROR: Direct Downloads saving requires Android 10 or newer.";
                }
                Uri uri = null;
                try {
                  String safeName = requestedName == null ? "ERecPass-Patient-QR.png"
                    : requestedName.replaceAll("[^a-zA-Z0-9._-]", "_");
                  ContentValues values = new ContentValues();
                  values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                  values.put(MediaStore.Downloads.MIME_TYPE, "image/png");
                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ERecPass");
                  values.put(MediaStore.Downloads.IS_PENDING, 1);
                  uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                  if (uri == null) return "ERROR: Android could not create the Downloads file.";
                  byte[] bytes = Base64.decode(base64Png, Base64.DEFAULT);
                  try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                    if (out == null) throw new IllegalStateException("Could not open Downloads file");
                    out.write(bytes);
                    out.flush();
                  }
                  ContentValues complete = new ContentValues();
                  complete.put(MediaStore.Downloads.IS_PENDING, 0);
                  getContentResolver().update(uri, complete, null, null);
                  return "OK:" + uri.toString();
                } catch (Exception e) {
                  if (uri != null) {
                    try { getContentResolver().delete(uri, null, null); } catch (Exception ignored) {}
                  }
                  return "ERROR:" + e.getMessage();
                }
              }
            }
          }
          JAVA
          npx cap sync android
      - name: Apply ERecPass launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          ICON="assets/erecpass-app-icon.svg"
          test -s "$ICON"
          RES="android/app/src/main/res"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            convert -background none "$ICON" -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
            convert -background none "$ICON" -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/drawable"
          convert -background none "$ICON" -resize 432x432 "$RES/drawable/ic_launcher_foreground.png"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK signature and Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/erecpass-apk-badging.txt
          grep -q "package: name='com.erecpass.hospital'" /tmp/erecpass-apk-badging.txt
          grep -q "sdkVersion:'22'" /tmp/erecpass-apk-badging.txt
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERecPass-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
