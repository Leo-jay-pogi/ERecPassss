name: Build ERecPass Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.svg"
      - "*.webp"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ERecPass
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare web assets and Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          rsync -av ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'www/' \
            --exclude 'android/' \
            --exclude 'node_modules/' \
            --exclude 'package-lock.json' \
            --exclude 'package.json'
          npm init -y
          npm install @capacitor/core@^6 @capacitor/android@^6
          npm install --save-dev @capacitor/cli@^6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.erecpass.hospital",
            "appName": "ERecPass",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERecPass-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
