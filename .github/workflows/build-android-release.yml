name: Build ERecPass Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ERecPass
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare web assets and Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          rsync -av ./ www/ \
            --exclude '.git/' --exclude '.github/' --exclude 'www/' \
            --exclude 'android/' --exclude 'node_modules/' \
            --exclude 'package-lock.json' --exclude 'package.json'
          npm init -y
          npm install @capacitor/core@^6 @capacitor/android@^6 @supabase/supabase-js@^2
          npm install --save-dev @capacitor/cli@^6 esbuild
          # Bundle Supabase locally for Android WebView so Admin login does not
          # depend on loading the Supabase SDK from a third-party CDN at runtime.
          mkdir -p www/vendor
          npx esbuild node_modules/@supabase/supabase-js/dist/module/index.js --bundle --format=iife --global-name=supabase --outfile=www/vendor/supabase.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text()
          old = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new = '<script src="./vendor/supabase.js"></script>'
          if old not in s:
              raise SystemExit("Could not find Supabase CDN script in packaged index.html")
          p.write_text(s.replace(old, new, 1))
          PY
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.erecpass.hospital",
            "appName": "ERecPass",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          # Native Android bridge for saving patient QR PNGs to Downloads.
          mkdir -p android/app/src/main/java/com/erecpass/hospital
          cat > android/app/src/main/java/com/erecpass/hospital/MainActivity.java <<'JAVA'
          package com.erecpass.hospital;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import java.io.OutputStream;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (bridge != null && bridge.getWebView() != null) {
                bridge.getWebView().addJavascriptInterface(new PatientQrDownloader(), "ERecPassNative");
              }
            }

            private class PatientQrDownloader {
              @JavascriptInterface
              public String savePng(String base64Png, String requestedName) {
                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                  return "ERROR: Direct Downloads saving requires Android 10 or newer.";
                }
                Uri uri = null;
                try {
                  String safeName = requestedName == null ? "ERecPass-Patient-QR.png"
                    : requestedName.replaceAll("[^a-zA-Z0-9._-]", "_");
                  ContentValues values = new ContentValues();
                  values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                  values.put(MediaStore.Downloads.MIME_TYPE, "image/png");
                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ERecPass");
                  values.put(MediaStore.Downloads.IS_PENDING, 1);
                  uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                  if (uri == null) return "ERROR: Android could not create the Downloads file.";
                  byte[] bytes = Base64.decode(base64Png, Base64.DEFAULT);
                  try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                    if (out == null) throw new IllegalStateException("Could not open Downloads file");
                    out.write(bytes);
                    out.flush();
                  }
                  ContentValues complete = new ContentValues();
                  complete.put(MediaStore.Downloads.IS_PENDING, 0);
                  getContentResolver().update(uri, complete, null, null);
                  return "OK:" + uri.toString();
                } catch (Exception e) {
                  if (uri != null) {
                    try { getContentResolver().delete(uri, null, null); } catch (Exception ignored) {}
                  }
                  return "ERROR:" + e.getMessage();
                }
              }
            }
          }
          JAVA
          npx cap sync android

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/erecpass-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/erecpass-release.jks"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = re.search(r"(?m)^\s*buildTypes\s*\{", s)
          if not marker:
              raise SystemExit("Could not locate Android buildTypes block")
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          s = s[:marker.start()] + signing + s[marker.start():]
          match = re.search(r"(?m)^(\s*)release\s*\{", s)
          if not match:
              raise SystemExit("Could not locate release build type")
          insert_at = match.end()
          s = s[:insert_at] + "\n" + match.group(1) + "    signingConfig signingConfigs.release" + s[insert_at:]
          p.write_text(s)
          PY
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ERecPass-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
